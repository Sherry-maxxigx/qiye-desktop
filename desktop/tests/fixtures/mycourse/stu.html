<script>
window.menuClicks=0;
sessionStorage.courseLoads=Number(sessionStorage.courseLoads||0)+1;

// deliberately too early; the bridge must retry without navigating data-url.
setTimeout(function(){
 document.querySelector('[dataname="zy"]').addEventListener('click',function(){
  window.menuClicks++;
  if(document.getElementById('frame_content-zy'))return;
  document.getElementById('frame_content-zj').style.display='none';
  var frame=document.createElement('iframe');frame.id='frame_content-zy';
  frame.src=sessionStorage.fixtureMode==='event-only'?'/work/event-list.html':'/homework-list-shell.html';document.body.appendChild(frame);
 });
},1800);
</script>
